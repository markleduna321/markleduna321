<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Mark Harvey Leduna — Solutions Architect and Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1a"/>
      <stop offset="1" stop-color="#0b0e24"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="50%" r="45%">
      <stop offset="0" stop-color="#2a2a7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a2a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9ff"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#05071a"/>
      <stop offset="1" stop-color="#0d1233"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .r1 { animation: rise .9s ease-out .1s both; }
      .r2 { animation: rise .9s ease-out .4s both; }
      .r3 { animation: rise .9s ease-out .7s both; }
      .r4 { animation: rise .9s ease-out 1.0s both; }
      .r5 { animation: rise .9s ease-out 1.3s both; }
      @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .caret { animation: caret 1s steps(1) infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="440" rx="18" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#cfd8ff">
    <circle cx="560" cy="40" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="320" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="400" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="410" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="22" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="-1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- LEFT: text -->
  <g class="r1">
    <line x1="50" y1="70" x2="90" y2="70" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="104" y="74" class="m" font-size="12" letter-spacing="3.5" fill="#8a93b8">MARK HARVEY LEDUNA</text>
  </g>
  <g class="r2">
    <text x="48" y="140" class="t" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Solutions Architect</text>
  </g>
  <g class="r3">
    <text x="48" y="198" class="t" font-size="50" font-weight="700" fill="url(#grad)" letter-spacing="-1.5">&amp; Full-Stack</text>
    <text x="48" y="256" class="t" font-size="50" font-weight="700" fill="url(#grad)" letter-spacing="-1.5">Developer<tspan class="caret" fill="#8be9ff">_</tspan></text>
  </g>
  <g class="r4">
    <text x="50" y="304" class="t" font-size="15" fill="#c3c9e6">Bridging complex engineering with strategic IT leadership to</text>
    <text x="50" y="326" class="t" font-size="15" fill="#c3c9e6">design scalable systems and build thoughtful digital experiences.</text>
  </g>
  <g class="r5">
    <rect x="50" y="352" width="196" height="40" rx="20" fill="#ffffff"/>
    <text x="148" y="377" class="t" font-size="14" fill="#0b0e24" text-anchor="middle">View Technical Projects  →</text>
    <rect x="258" y="352" width="168" height="40" rx="20" fill="#12162c" stroke="#2a3050"/>
    <text x="342" y="377" class="t" font-size="14" fill="#e6e9f7" text-anchor="middle">Open Portfolio  ↗</text>
    <text x="50" y="418" class="m" font-size="11" letter-spacing="2.5" fill="#5d6588">LARAVEL • REACT • PYTHON • AI INTEGRATION</text>
  </g>

  <!-- RIGHT: orbit system, center (770,215) -->
  <g transform="translate(770,215)">

    <!-- orbit rings -->
    <g fill="none" stroke-width="1.2">
      <ellipse rx="215" ry="115" transform="rotate(-14)" stroke="#5b6490" stroke-opacity="0.6"/>
      <circle r="150" stroke="#4aa3b8" stroke-opacity="0.65"/>
      <ellipse rx="185" ry="90" transform="rotate(24)" stroke="#6a72a0" stroke-opacity="0.5"/>
    </g>

    <!-- orbiting nodes: ring 1 -->
    <g transform="rotate(-14)" fill="#e6ecff">
      <circle r="8"><animateMotion dur="46s" repeatCount="indefinite" begin="0s" path="M215,0 A215,115 0 1,1 -215,0 A215,115 0 1,1 215,0"/></circle>
      <circle r="5"><animateMotion dur="46s" repeatCount="indefinite" begin="-9s" path="M215,0 A215,115 0 1,1 -215,0 A215,115 0 1,1 215,0"/></circle>
      <circle r="9"><animateMotion dur="46s" repeatCount="indefinite" begin="-20s" path="M215,0 A215,115 0 1,1 -215,0 A215,115 0 1,1 215,0"/></circle>
      <circle r="4"><animateMotion dur="46s" repeatCount="indefinite" begin="-31s" path="M215,0 A215,115 0 1,1 -215,0 A215,115 0 1,1 215,0"/></circle>
      <circle r="6"><animateMotion dur="46s" repeatCount="indefinite" begin="-39s" path="M215,0 A215,115 0 1,1 -215,0 A215,115 0 1,1 215,0"/></circle>
    </g>

    <!-- ring 2 (reverse direction) -->
    <g fill="#d6e6ff">
      <circle r="6"><animateMotion dur="34s" repeatCount="indefinite" begin="0s" path="M150,0 A150,150 0 1,0 -150,0 A150,150 0 1,0 150,0"/></circle>
      <circle r="8"><animateMotion dur="34s" repeatCount="indefinite" begin="-8s" path="M150,0 A150,150 0 1,0 -150,0 A150,150 0 1,0 150,0"/></circle>
      <circle r="4"><animateMotion dur="34s" repeatCount="indefinite" begin="-17s" path="M150,0 A150,150 0 1,0 -150,0 A150,150 0 1,0 150,0"/></circle>
      <circle r="7"><animateMotion dur="34s" repeatCount="indefinite" begin="-26s" path="M150,0 A150,150 0 1,0 -150,0 A150,150 0 1,0 150,0"/></circle>
    </g>

    <!-- ring 3 -->
    <g transform="rotate(24)" fill="#e6ecff">
      <circle r="7"><animateMotion dur="40s" repeatCount="indefinite" begin="0s" path="M185,0 A185,90 0 1,1 -185,0 A185,90 0 1,1 185,0"/></circle>
      <circle r="4"><animateMotion dur="40s" repeatCount="indefinite" begin="-12s" path="M185,0 A185,90 0 1,1 -185,0 A185,90 0 1,1 185,0"/></circle>
      <circle r="8"><animateMotion dur="40s" repeatCount="indefinite" begin="-24s" path="M185,0 A185,90 0 1,1 -185,0 A185,90 0 1,1 185,0"/></circle>
      <circle r="5"><animateMotion dur="40s" repeatCount="indefinite" begin="-33s" path="M185,0 A185,90 0 1,1 -185,0 A185,90 0 1,1 185,0"/></circle>
    </g>

    <!-- wireframe sphere -->
    <circle r="82" fill="url(#core)" stroke="#8a93c4" stroke-opacity="0.8" stroke-width="1.4"/>
    <g fill="none" stroke="#8a93c4" stroke-opacity="0.55" stroke-width="1">
      <!-- latitudes -->
      <ellipse cx="0" cy="0" rx="82" ry="16"/>
      <ellipse cx="0" cy="-42" rx="70" ry="13"/>
      <ellipse cx="0" cy="42" rx="70" ry="13"/>
      <ellipse cx="0" cy="-65" rx="50" ry="9"/>
      <ellipse cx="0" cy="65" rx="50" ry="9"/>
      <!-- rotating longitudes -->
      <ellipse cx="0" cy="0" rx="82" ry="82"><animate attributeName="rx" values="82;0;82" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="0" cy="0" rx="58" ry="82"><animate attributeName="rx" values="58;0;58;82;58" keyTimes="0;0.3;0.5;0.8;1" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="0" cy="0" rx="30" ry="82"><animate attributeName="rx" values="30;82;30;0;30" keyTimes="0;0.25;0.5;0.75;1" dur="14s" repeatCount="indefinite"/></ellipse>
      <line x1="0" y1="-82" x2="0" y2="82"/>
    </g>

    <!-- glowing core lights -->
    <g>
      <circle cx="14" cy="-8" r="9" fill="#3b6bff" filter="url(#blur)"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="14" cy="-8" r="2.6" fill="#ffffff"/>
      <circle cx="-25" cy="22" r="9" fill="#6a4bff" filter="url(#blur)"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="-25" cy="22" r="2.6" fill="#ffffff"/>
    </g>

    <!-- floating tags -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="5s" repeatCount="indefinite"/>
      <rect x="-262" y="-122" width="120" height="30" rx="10" fill="#0d1226" stroke="#262c4d"/>
      <circle cx="-246" cy="-107" r="3.5" fill="#1ea7ff"/>
      <text x="-236" y="-103" class="t" font-size="11" font-weight="700" letter-spacing="0.8" fill="#e6e9f7">AUTOMATION</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="128" width="170" height="30" rx="10" fill="#0d1226" stroke="#262c4d"/>
      <circle cx="76" cy="143" r="3.5" fill="#6366f1"/>
      <text x="86" y="147" class="t" font-size="11" font-weight="700" letter-spacing="0.8" fill="#e6e9f7">SYSTEMS ARCHITECTURE</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;0,0" dur="7s" repeatCount="indefinite"/>
      <rect x="110" y="-130" width="96" height="30" rx="10" fill="#0d1226" stroke="#262c4d"/>
      <circle cx="126" cy="-115" r="3.5" fill="#22d3ee"/>
      <text x="136" y="-111" class="t" font-size="11" font-weight="700" letter-spacing="0.8" fill="#e6e9f7">EDGE AI</text>
    </g>

    <text y="190" text-anchor="middle" class="m" font-size="10" letter-spacing="2.5" fill="#5d6588">SYSTEMS IN MOTION</text>
  </g>
</svg>
